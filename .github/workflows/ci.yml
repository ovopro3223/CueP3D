name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  KTX_SOFTWARE_VERSION: '4.4.2'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg (libaom-av1, libvpx-vp9 — no legacy codec use)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install toktx (KTX-Software)
        run: |
          curl -fsSL -o ktx.deb \
            "https://github.com/KhronosGroup/KTX-Software/releases/download/v${KTX_SOFTWARE_VERSION}/KTX-Software-${KTX_SOFTWARE_VERSION}-Linux-x86_64.deb"
          sudo apt-get install -y ./ktx.deb
          toktx --version

      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - uses: actions/setup-node@v4
        with:
          # pnpm 11.x requires Node >=22.13 (uses node:sqlite internally) —
          # bumped from 20 after the first real CI run failed with
          # ERR_UNKNOWN_BUILTIN_MODULE: node:sqlite.
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        # Unscoped `pnpm exec` recurses into every workspace package and
        # fails on the first one without a local `playwright` binary
        # (ERR_PNPM_RECURSIVE_EXEC_FIRST_FAIL) — scope it to a package that
        # actually depends on playwright. The browser binary cache
        # (~/.cache/ms-playwright) is machine-wide, not per-package.
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @cuep3d/viewer exec playwright install --with-deps chromium

      - name: Install Playwright's OS dependencies (cache hit still needs these)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @cuep3d/viewer exec playwright install-deps chromium

      - name: Fetch sample models
        run: pnpm run fetch-samples

      - name: Build demo assets (bench's e2e smoke test needs real models)
        run: pnpm run demo:assets

      - name: Lint
        run: pnpm run lint

      - name: Format check
        run: pnpm run format

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit + integration tests
        run: pnpm run test

      - name: Build one sample via the CLI
        # No `--` separator: the cuep3d script forwards argv[0] straight to
        # bin.ts's command check, and a literal "--" there isn't "build".
        run: pnpm run cuep3d build samples/Avocado.glb -o /tmp/cuep3d-out/avocado

      - name: Codec policy gate
        run: pnpm run assert-free-codecs -- fixtures /tmp/cuep3d-out

      - name: License policy gate
        run: pnpm run check-licenses

      - name: Upload benchmarks (if present)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmarks
          path: BENCHMARKS.md
          if-no-files-found: ignore
