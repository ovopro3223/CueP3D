name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  KTX_SOFTWARE_VERSION: '4.4.2'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install toktx (KTX-Software)
        run: |
          curl -fsSL -o ktx.deb \
            "https://github.com/KhronosGroup/KTX-Software/releases/download/v${KTX_SOFTWARE_VERSION}/KTX-Software-${KTX_SOFTWARE_VERSION}-Linux-x86_64.deb"
          sudo apt-get install -y ./ktx.deb

      - name: Allow Chromium's sandbox (Ubuntu 23.10+ restricts unprivileged user namespaces)
        # Same as ci.yml: build-proxy renders through puppeteer with Chromium's
        # sandbox on. Chromium's documented fix, keeps the sandbox:
        # https://chromium.googlesource.com/chromium/src/+/main/docs/security/apparmor-userns-restrictions.md
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - uses: actions/setup-node@v4
        with:
          # pnpm 11.x requires Node >=22.13 (uses node:sqlite internally) —
          # bumped from 20 after the first real CI run failed with
          # ERR_UNKNOWN_BUILTIN_MODULE: node:sqlite.
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium's shared libraries
        # puppeteer's Chromium (build-proxy) needs the same OS libraries
        # Playwright's does; ci.yml gets them from `playwright install
        # --with-deps`, this workflow installs no browsers so ask for the
        # libraries alone.
        run: pnpm --filter @cuep3d/viewer exec playwright install-deps chromium

      - name: Fetch sample models
        run: pnpm run fetch-samples

      - name: Build packages
        # build-assets.mjs invokes the compiled CLI (packages/cli/dist/bin.js).
        run: pnpm run build

      - name: Build demo assets
        run: pnpm run demo:assets

      - name: Build demo site
        # GitHub Pages serves a project site from /<repo-name>/ — derive it
        # from the actual repo name rather than hardcoding one (D-002 never
        # settled a final GitHub repo name; apps/demo/vite.config.ts's own
        # default is just a placeholder for local dev).
        run: pnpm --filter @cuep3d/demo run build
        env:
          CUEP3D_DEMO_BASE: /${{ github.event.repository.name }}/

      - uses: actions/configure-pages@v5
        with:
          # First deploy on a fresh repo: switch Pages to the "GitHub Actions"
          # source instead of requiring a manual Settings → Pages step.
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/demo/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
